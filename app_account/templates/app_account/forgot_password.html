{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Green Pastures School</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="max-w-md w-full bg-white rounded-[24xl] shadow-xl shadow-slate-200/50 p-8 lg:p-12"
    >
      <div id="request-view">
        <div class="mb-8">
          {% if message %}
          <div class="mb-6 p-4 bg-green-100 text-green-800 rounded-lg">
            {{ message }}
          </div>
          {% endif %}
          <a
            href="{% url 'login' %}"
            class="flex items-center text-slate-500 hover:text-slate-900 transition text-sm font-medium mb-6"
          >
            <svg
              class="w-4 h-4 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
            Back to login
          </a>
          <h1 class="text-2xl font-bold text-slate-900">Forgot Password?</h1>
          <p class="text-slate-500 text-sm mt-2">
            Enter your work email address and we'll send you a link to reset
            your account access.
          </p>
        </div>

        <form id="forgot-form" class="space-y-6" method="POST" action=".">
          {% csrf_token %}
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2"
              >Work Email Address</label
            >
            <input
              type="email"
              id="email-input"
              name="email"
              required
              placeholder="admin@greenpastures.edu.gh"
              class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600/20 focus:border-green-600 transition"
            />
          </div>
          <button
            type="submit"
            class="w-full py-4 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition shadow-lg shadow-green-200"
          >
            Send Reset Link
          </button>
        </form>
      </div>
    </div>
  </body>
  <script>
    document
      .getElementById("forgot-form")
      .addEventListener("submit", function (event) {
        event.preventDefault();
        const email = document.getElementById("email-input").value;
        console.log("Email submitted for password reset:", email);
        this.submit();
      });
  </script>
</html>
