<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security | Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md animate-in">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-600 rounded-2xl shadow-xl shadow-green-200 mb-6">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Reset Password</h1>
            <p class="text-slate-500 mt-2 font-medium">Please secure your account with a new password.</p>
        </div>

        <div class="bg-white rounded-[2.5rem] p-10 shadow-2xl shadow-slate-200/60 border border-slate-100">
            <form action="." onsubmit="handleReset(event)" class="space-y-6">
                <div>
                    {% if message%}
                    <div class="mb-6 p-4 bg-green-100 text-green-800 rounded-lg">
                    {{ message }}
                </div>
                    {% endif %}
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2.5">Current Password</label>
                    <div class="relative">
                        <input type="password" name="current_password" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-green-600/10 focus:border-green-600 outline-none transition-all placeholder:text-slate-300">
                    </div>
                </div>

                <div class="pt-2 border-t border-slate-100">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2.5">New Password</label>
                    <input id="new-password" name="new_password" type="password" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-green-600/10 focus:border-green-600 outline-none transition-all">
                    <p class="mt-2 text-[10px] text-slate-400 font-medium italic">Minimum 8 characters with numbers and letters.</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2.5">Confirm New Password</label>
                    <input id="confirm-password" name="confirm_password" type="password" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-green-600/10 focus:border-green-600 outline-none transition-all">
                </div>

                <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition-all shadow-xl shadow-slate-200 flex items-center justify-center gap-2">
                    Update Password
                </button>

                <div class="text-center pt-2">
                    <a href="staff-dashboard.html" class="text-sm font-bold text-slate-400 hover:text-green-600 transition-colors">Back to Dashboard</a>
                </div>
            </form>
        </div>

        <div id="success-msg" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-green-600 text-white px-8 py-4 rounded-2xl shadow-2xl font-bold flex items-center gap-3 animate-in">
            {% if messages%}
                    <div class="mb-6 p-4 bg-green-100 text-red-800 rounded-lg">
                    {{ messages }}
                </div>
                    {% endif %}
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            Password Updated Successfully!
        </div>
    </div>

    <script>
        function handleReset(e) {
            e.preventDefault();
            const newPass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;

            if (newPass !== confirmPass) {
                alert("Passwords do not match!");
                return;
            }

            const successMsg = document.getElementById('success-msg');
            successMsg.classList.remove('hidden');
            
            setTimeout(() => {
                window.location.href = '{% url 'staff_dashboard' %}';
            }, 2000);
        }
    </script>
</body>
</html>
