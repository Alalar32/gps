<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal | Green Pastures School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <main>
      <div
        id="login-screen"
        class="min-h-screen flex items-center justify-center p-4"
      >
        <div
          class="max-w-md w-full bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 p-8 lg:p-12"
        >
          <div class="text-center mb-10">
            <div
              class="w-16 h-16 bg-green-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4"
            >
              G
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Login</h1>
            <p class="text-slate-500 text-sm mt-2">
              Access the Green Pastures System
            </p>
          </div>

          <form id="login-form" class="space-y-6">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2"
                >Staff ID / Email</label
              >
              <input
                type="text"
                required
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600/20 focus:border-green-600 transition"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2"
                >Password</label
              >
              <input
                type="password"
                required
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600/20 focus:border-green-600 transition"
              />
            </div>
            <button
              type="submit"
              class="w-full py-4 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition shadow-lg shadow-green-200"
            >
              Sign In
            </button>
            <div class="text-center mt-4">
              <a
                href="{% url 'forgot_password' %}"
                class="text-sm text-green-600 hover:underline"
                >Forgot your password?</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>

    <script>
      const loginForm = document.getElementById("login-form");
      const loginScreen = document.getElementById("login-screen");
      const dashboard = document.getElementById("dashboard");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
      });
    </script>
  </body>
</html>
