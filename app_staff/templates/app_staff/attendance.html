{% extends "app_staff/base.html" %}
{% block title %}Daily Attendance{% endblock %}
{% block content %}
<div id="attendance-view" >
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                            <div>
                                <h3 class="text-xl font-bold text-slate-900">Daily Attendance Roll</h3>
                                <p id="today-date" class="text-sm text-slate-500 font-medium"></p>
                            </div>
                            <button class="px-6 py-3 bg-green-600 text-white rounded-xl text-sm font-bold shadow-lg shadow-green-100 hover:bg-green-700 transition-all">Submit Final Roll</button>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="attendance-list">
                            <div class="flex items-center justify-between p-5 bg-slate-50 border border-slate-100 rounded-2xl transition-all hover:bg-white hover:shadow-md">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-500">DO</div>
                                    <span class="font-bold text-slate-700">David Osei</span>
                                </div>
                                <div class="flex bg-white p-1 rounded-xl border border-slate-200">
                                    <button class="px-4 py-2 bg-green-600 text-white rounded-lg text-xs font-bold transition-all">Present</button>
                                    <button class="px-4 py-2 text-slate-400 hover:text-red-600 rounded-lg text-xs font-bold transition-all">Absent</button>
                                          </div>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
{% endblock %}
