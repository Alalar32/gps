{% extends "app_staff/base.html" %} {% block title %}Generate Reports{% endblock %}
{% block content %}
  <div id="reports-view" class=" space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div
        class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm"
      >
        <h4
          class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2"
        >
          <span class="w-2 h-6 bg-green-600 rounded-full"></span>
          Input Academic Grades
        </h4>
        <div class="space-y-5">
          <div>
            <label
              class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2"
              >Select Subject</label
            >
            <select
              class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-600/10 focus:border-green-600 transition-all outline-none"
            >
              <option>Mathematics</option>
              <option>English Language</option>
              <option>Integrated Science</option>
              <option>Social Studies</option>
            </select>
          </div>
          <div>
            <label
              class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2"
              >Student Name</label
            >
            <input
              type="text"
              placeholder="Start typing student name..."
              class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-600/10 focus:border-green-600 transition-all outline-none"
            />
          </div>
          <div class="grid grid-cols-2 gap-6">
            <div>
              <label
                class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2"
                >Class Work (40%)</label
              >
              <input
                type="number"
                placeholder="0-40"
                class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-600/10 focus:border-green-600 transition-all outline-none"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2"
                >Exam (60%)</label
              >
              <input
                type="number"
                placeholder="0-60"
                class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-600/10 focus:border-green-600 transition-all outline-none"
              />
            </div>
          </div>
          <button
            class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-all shadow-xl shadow-slate-200"
          >
            Save Progress Report
          </button>
        </div>
      </div>
      <div class="space-y-6">
        <div
          class="bg-green-600 p-8 rounded-[2rem] text-white shadow-xl shadow-green-100 flex flex-col justify-between h-full"
        >
          <div>
            <div
              class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mb-6"
            >
              <svg
                class="w-6 h-6 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                ></path>
              </svg>
            </div>
            <h4 class="text-xl font-bold mb-2">Batch Report Generator</h4>
            <p class="text-green-50 text-sm leading-relaxed mb-8 opacity-90">
              Ready to conclude the term? Generate complete PDF report cards for
              all students in Basic 4A with one click.
            </p>
          </div>
          <button
            class="w-full py-4 bg-white text-green-700 rounded-xl font-bold hover:bg-green-50 transition-all shadow-lg"
          >
            Download All Reports (.ZIP)
          </button>
        </div>
      </div>
    </div>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const navButtons = document.querySelectorAll(".nav-btn");
      navButtons.forEach((button) => {
        button.addEventListener("click", function () {
          navButtons.forEach((btn) => btn.classList.remove("active"));
          this.classList.add("active");
        });
      });
    });
  </script>
  {% endblock %}
</main>
