<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Term</title>
</head>
<body>
    <h1>Edit Term</h1>
    <form method="post">
        {% csrf_token %}
        <label for="term">Term:</label>
        <input type="text" id="term" name="term" value="{{ term.name }}" required>
        <label for="year">Academic Year:</label>
        <select id="year" name="year" required>
            {% for academic_year in academic_years %}
                <option value="{{ academic_year.id }}" {% if term.academic_year.id == academic_year.id %}selected{% endif %}>
                    {{ academic_year.name }}
                </option>
            {% endfor %}
        </select>
        <label for="start_date">Start Date:</label>
        <input type="date" id="start_date" name="start_date" value="{{ term.start_date }}" required>
        <label for="end_date">End Date:</label>
        <input type="date" id="end_date" name="end_date" value="{{ term.end_date }}" required>
        <label for="is_active">Is Active:</label>
        <input type="checkbox" id="is_active" name="is_active" {% if term.is_active %}checked{% endif %}>
        <button type="submit">Update Term</button>
    </form>
</body>
</html>
